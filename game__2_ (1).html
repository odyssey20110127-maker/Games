/* =========================================================================
   2-PLAYER HOTSEAT (PvP) MODE — pass the iPad back and forth
   Implementation trick: card effects/dealDamage/gainBlock/etc. everywhere
   in this file operate on the generic "G.player" (active side) and the lone
   entry in "G.combat.enemies" (the opposing side). By swapping which real
   player object is assigned to G.player/G.combat.enemies[0] at the start of
   each turn, the entire existing card/combat engine works for PvP with no
   changes to card logic at all.
========================================================================= */
function newPvpPlayerState(name, deckIds){
  return {
    name, uid: nextUid(),
    hp:75, maxHp:75, block:0, strength:0, dexterity:0, weak:0, vulnerable:0, frail:0, poison:0, poisonRes:0,
    powers:{}, potions:[], relics:[], maxEnergyBonus:0, flexAmt:0, gold:0,
    deck: deckIds.map(id=>createCard(id)),
    _drawPile:[], _hand:[], _discardPile:[], _exhaustPile:[], _turn:1, _dmgTaken:0, _pendingDelayedBlock:0,
  };
}
window.startPvpSetup=function(){
  newGame();
  G.mode='pvp';
  openDeckBuilder('⚔️ プレイヤー1：デッキを編成', 10, null, (deck1)=>{
    G.pvpTempDeck1 = deck1;
    G.pvpPassBuildNext = 2;
    G.screen='pvppassbuild';
    render();
  });
};
window.pvpConfirmPassBuild=function(){
  openDeckBuilder('⚔️ プレイヤー2：デッキを編成', 10, null, (deck2)=>{
    beginPvpMatch(G.pvpTempDeck1, deck2);
  });
};
function renderPvpPassBuild(){
  app.innerHTML = `<div class="screen end-screen">
    <div style="font-size:54px;">📱</div>
    <h2 style="color:var(--gold); font-size:22px;">iPadをプレイヤー${G.pvpPassBuildNext}に渡してください</h2>
    <div class="modal-sub">プレイヤー${G.pvpPassBuildNext}の準備ができたらタップしてデッキを編成してください。<br>（相手にデッキ内容を見られないようご注意を）</div>
    <button class="btn btn-main" onclick="pvpConfirmPassBuild()">準備完了・デッキを編成する</button>
  </div>`;
}
function beginPvpMatch(deck1Ids, deck2Ids){
  G.mode='pvp';
  G.pvpPlayers = [ newPvpPlayerState('プレイヤー1', deck1Ids), newPvpPlayerState('プレイヤー2', deck2Ids) ];
  G.pvpPlayers.forEach(p=>{ p._drawPile = shuffle(p.deck.map(c=>({...c}))); p._hand=[]; p._discardPile=[]; p._exhaustPile=[]; p._turn=1; });
  G.pvpNextIdx = 0;
  G.screen='pvppass';
  render();
}
function pvpStartTurn(idx){
  G.pvpActive = idx;
  const me = G.pvpPlayers[idx];
  const opp = G.pvpPlayers[1-idx];
  G.player = me;
  G.combat = {
    kind:'pvp', enemies:[opp],
    drawPile: me._drawPile, hand: me._hand, discardPile: me._discardPile, exhaustPile: me._exhaustPile,
    energy:0, maxEnergy:maxEnergyOf(),
    turn: me._turn,
    noMoreDrawThisTurn:false, rageAmt:0, flameBarrier:0, ghostCloakReady:false, emberGuardUsed:false,
    damageTakenThisCombat: me._dmgTaken||0, selectedIdx:null, cardsPlayedThisTurn:0, skillsPlayedThisTurn:0, attacksPlayedThisTurn:0,
    echoNext:false, nextAttackBonus:0, pendingDelayedBlock: me._pendingDelayedBlock||0, prevHandUids:new Set(),
    isPvp:true,
  };
  me.block=0;
  if(me.weak>0) addStatus(me,'weak',-1);
  if(me.vulnerable>0) addStatus(me,'vulnerable',-1);
  if(me.frail>0) addStatus(me,'frail',-1);
  if(G.combat.pendingDelayedBlock){ gainBlock(me, G.combat.pendingDelayedBlock); G.combat.pendingDelayedBlock=0; }
  drawCards(5 + (me.powers.extraDraw||0));
  G.combat.energy = maxEnergyOf();
  if(me.powers.regen){ const h=me.powers.regen; me.hp=clamp(me.hp+h,0,me.maxHp); queueFx(me,'+'+h,'heal'); }
  if(me.powers.droneHive){ const e2=randomAliveEnemy(); if(e2) dealDamage(me, e2, me.powers.droneHive); }
  if(me.poison>0){ const p=me.poison; me.hp=clamp(me.hp-p,0,me.maxHp); addStatus(me,'poison',-1); queueFx(me,'-'+p,'dmg'); me._justHit=true; }
  if(me.powers.combust){ me.hp=clamp(me.hp-1,0,me.maxHp); me._justHit=true; if(opp.hp>0) dealDamage(me,opp,me.powers.combust); }
  if(me.powers.demonForm) addStatus(me,'strength',me.powers.demonForm);
  if(me.powers.metallicize) gainBlock(me,me.powers.metallicize);
  if(me.powers.berserk){ me.hp=clamp(me.hp-2,0,me.maxHp); me._justHit=true; G.combat.energy+=1; }
  G.screen='pvpcombat';
  showTurnBanner(me.name+'のターン');
  pvpCheckCombatEnd();
  render();
}
window.pvpEndTurn=function(){
  const c=G.combat;
  if(!c || c.over) return;
  const me=G.player;
  if(me.flexAmt){ addStatus(me,'strength',-me.flexAmt); me.flexAmt=0; }
  let i=c.hand.length;
  while(i--){
    const card=c.hand[i];
    if(card.retain) continue;
    c.hand.splice(i,1);
    if(card.exhaust) c.exhaustPile.push(card); else c.discardPile.push(card);
  }
  me._turn = c.turn+1;
  me._pendingDelayedBlock = c.pendingDelayedBlock||0;
  me._dmgTaken = c.damageTakenThisCombat||0;
  G.pvpNextIdx = 1-G.pvpActive;
  G.screen='pvppass';
  render();
};
window.pvpConfirmPass=function(){ pvpStartTurn(G.pvpNextIdx); };
function renderPvpPass(){
  const next=G.pvpPlayers[G.pvpNextIdx];
  app.innerHTML = `<div class="screen end-screen">
    <div style="font-size:54px;">📱</div>
    <h2 style="color:var(--gold); font-size:22px;">iPadを${next.name}に渡してください</h2>
    <div class="modal-sub">${next.name}の準備ができたらタップして次のターンを開始してください。</div>
    <button class="btn btn-main" onclick="pvpConfirmPass()">タップしてターン開始</button>
  </div>`;
}
function pvpCheckCombatEnd(){
  const c=G.combat;
  if(!c || c.over) return;
  const me=G.player, opp=c.enemies[0];
  if(me.hp<=0){
    c.over=true; me.hp=0;
    setTimeout(()=>{ G.pvpWinner=1-G.pvpActive; G.screen='pvpresult'; render(); }, 500);
    return;
  }
  if(opp.hp<=0){
    c.over=true; opp.hp=0;
    setTimeout(()=>{ G.pvpWinner=G.pvpActive; G.screen='pvpresult'; render(); }, 500);
    return;
  }
}
function renderPvpResult(){
  const winner=G.pvpPlayers[G.pvpWinner];
  const loser=G.pvpPlayers[1-G.pvpWinner];
  app.innerHTML = `<div class="screen end-screen">
    <div style="font-size:54px;">🏆</div>
    <h2 style="color:var(--gold); font-size:28px;">${winner.name}の勝利！</h2>
    <div class="modal-sub">${loser.name}を打ち破った。</div>
    <div class="stat-grid">
      <div class="stat-box"><b>${winner.hp}/${winner.maxHp}</b><span>${winner.name} 残りHP</span></div>
      <div class="stat-box"><b>${winner.deck.length}</b><span>デッキ枚数</span></div>
    </div>
    <button class="btn btn-main" onclick="rematchPvp()">同じデッキでもう一度</button>
    <button class="btn btn-ghost" onclick="backToTitleFromPvp()">タイトルへ戻る</button>
  </div>`;
}
window.rematchPvp=function(){
  const d1 = G.pvpPlayers[0].deck.map(c=>c.id);
  const d2 = G.pvpPlayers[1].deck.map(c=>c.id);
  beginPvpMatch(d1, d2);
};
window.backToTitleFromPvp=function(){
  newGame();
  G.screen='title';
  render();
};
function renderPvpCombat(){
  const c=G.combat;
  const me=G.player;
  const opp=c.enemies[0];
  const energyMax=c.maxEnergy;

  const oppStatuses=[];
  if(opp.strength) oppStatuses.push(`<span class="status-chip">💪${opp.strength}</span>`);
  if(opp.dexterity) oppStatuses.push(`<span class="status-chip">🤸${opp.dexterity}</span>`);
  if(opp.weak) oppStatuses.push(`<span class="status-chip">😩${opp.weak}</span>`);
  if(opp.vulnerable) oppStatuses.push(`<span class="status-chip">🎯${opp.vulnerable}</span>`);
  if(opp.frail) oppStatuses.push(`<span class="status-chip">😓${opp.frail}</span>`);
  if(opp.poison) oppStatuses.push(`<span class="status-chip">☠️${opp.poison}</span>`);
  if(opp.poisonRes) oppStatuses.push(`<span class="status-chip">🧪${opp.poisonRes}</span>`);
  let oppCls='enemy-sprite';
  if(opp._justHit) oppCls+=' shake-hit flash-hit';
  opp._justHit=false;
  const oppBlockPop = opp._justBlocked? ' pop-block':'';
  opp._justBlocked=false;

  const newHandUids = new Set(c.hand.map(cd=>cd.uid));
  const handHtml = c.hand.map((card,idx)=>{
    const cost = card.cost===-1 ? 'X' : card.cost;
    const cantAfford = card.cost!==-1 && card.cost>c.energy;
    const isNew = c.prevHandUids && !c.prevHandUids.has(card.uid);
    const cls=['card',card.type,card.future?'future':'',card.space?'space':'',card.upgraded?'upgraded':'', (c.selectedIdx===idx)?'selected':'', (cantAfford||card.unplayable)?'unplayable':'', isNew?'card-deal':''].join(' ');
    const rarityColor = ({basic:'#8a8a8a',common:'var(--common)',uncommon:'var(--uncommon)',rare:'var(--rare)'})[card.rarity]||'#888';
    return `<div class="${cls}" data-card-uid="${card.uid}" onclick="selectCard(${idx})">
      <div class="card-cost">${cost}</div>
      ${card.upgraded?'<div class="upgrade-flag">+</div>':''}
      ${card.retain?'<div class="retain-flag">🔁</div>':''}
      ${card.future?'<div class="future-badge">⚡未来</div>':''}
      ${card.space?'<div class="space-badge">🌌宇宙</div>':''}
      <div class="card-name">${card.name}</div>
      <div class="card-art">${({attack:'⚔️',skill:'🛡️',power:'✨'})[card.type]||''}</div>
      <div class="card-type">${({attack:'攻撃',skill:'スキル',power:'パワー'})[card.type]||''}</div>
      <div class="card-desc">${card.desc(card)}</div>
      <div class="card-rarity-dot" style="background:${rarityColor}"></div>
    </div>`;
  }).join('');
  c.prevHandUids=newHandUids;

  const meStatuses=[];
  if(me.strength) meStatuses.push(`💪${me.strength}`);
  if(me.dexterity) meStatuses.push(`🤸${me.dexterity}`);
  if(me.weak) meStatuses.push(`😩${me.weak}`);
  if(me.vulnerable) meStatuses.push(`🎯${me.vulnerable}`);
  if(me.frail) meStatuses.push(`😓${me.frail}`);
  if(me.poison) meStatuses.push(`☠️${me.poison}`);
  if(me.poisonRes) meStatuses.push(`🧪${me.poisonRes}`);
  let portraitCls='player-portrait';
  if(me._justHit) portraitCls+=' shake-hit flash-hit';
  me._justHit=false;
  const meBlockPop = me._justBlocked? ' pop-block':'';
  me._justBlocked=false;

  app.innerHTML = `
  <div class="screen combat-screen">
    <div class="stage-label">⚔️ 2人対戦 ・ ${me.name}のターン ・ ターン${c.turn}</div>
    <div class="enemy-row">
      <div class="enemy">
        <div class="intent">🤺 ${opp.name}</div>
        <div class="${oppCls}" data-euid="${opp.uid}" style="background:radial-gradient(circle at 35% 30%, #6b4a5ccc, #241d3055); position:relative;">
          🛡️${opp.block>0?`<div class="block-chip${oppBlockPop}">🛡️${opp.block}</div>`:''}
        </div>
        <div class="enemy-name">${opp.name}（相手）</div>
        <div class="hpbar-wrap">${(()=>{ const b=hpBarHtml(opp,8); return b.bar+`<div class="hp-text">${opp.hp}/${opp.maxHp}${b.warn}</div>`; })()}</div>
        <div class="status-row">${oppStatuses.join('')}</div>
      </div>
    </div>
    <div class="mid-area">
      <div class="piles-row">
        <div class="pile-chip" onclick="openPileModal('draw')">📥<b>${c.drawPile.length}</b>山札</div>
        <div class="pile-chip" onclick="openPileModal('discard')">📤<b>${c.discardPile.length}</b>捨札</div>
        <div class="pile-chip" onclick="openPileModal('exhaust')">🔥<b>${c.exhaustPile.length}</b>消滅</div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="player-info-row">
        <div class="${portraitCls}" data-euid="player">🗡️${me.block>0?`<div class="block-chip${meBlockPop}">🛡️${me.block}</div>`:''}</div>
        <div class="player-vitals">
          ${(()=>{ const b=hpBarHtml(me,14); return b.bar+`<div class="hp-text">${me.name}: ${me.hp}/${me.maxHp}${b.warn} ${meStatuses.length?(' ・ '+meStatuses.join(' ')):''}</div>`; })()}
        </div>
        <div class="energy-orb">${c.energy}/${energyMax}</div>
        <button class="end-turn-btn" onclick="pvpEndTurn()">ターン終了</button>
      </div>
      <div class="hand-row">${handHtml}</div>
    </div>
  </div>`;
  flushFx();
}

/* =========================================================================
   ENDLESS MODE — after clearing all 9 chapters, keep generating floors
   forever with escalating enemy HP, reusing the existing map/combat engine
   by dynamically appending synthetic ACT_CONFIG entries.
========================================================================= */
window.startEndlessMode=function(){
  G.endless = true;
  G.endlessFloor = 1;
  G.combat = null;
  advanceEndlessFloor();
};
function advanceEndlessFloor(){
  const floor = G.endlessFloor;
  const hpMult = 1 + Math.min(1.6, (floor-1)*0.07);
  const idx = ACT_CONFIG.length;
  ACT_CONFIG.push({
    tower: 3, name: `エンドレス フロア${floor}`,
    normals: shuffle([...ALL_NORMALS]).slice(0,5),
    elites: shuffle([...ALL_ELITES]).slice(0,2),
    boss: choice(ALL_BOSSES),
    hpMult, endless:true,
  });
  ACT_MODIFIERS.push(null);
  G.act = idx;
  G.map = generateMap(idx);
  G.mapFlat = flattenMap(G.map);
  G.currentNodeId = null;
  G.screen='map';
  render();
}

/* =========================================================================
   BOSS RUSH MODE — build a deck, then fight all bosses back-to-back,
   fully healing between each, reusing the existing combat/reward engine.
========================================================================= */
window.startBossRush=function(){
  newGame();
  G.bossRush = true;
  openDeckBuilder('🔥 ボスラッシュ：デッキを編成', 10, null, (deckIds)=>{
    G.player.deck = deckIds.map(id=>createCard(id));
    G.player.hp = 85; G.player.maxHp = 85; G.player.gold = 50;
    G.bossRushQueue = shuffle([...ALL_BOSSES]);
    G.bossRushIdx = -1;
    advanceBossRush();
  });
};
function advanceBossRush(){
  G.bossRushIdx++;
  if(G.bossRushIdx>=G.bossRushQueue.length){
    G.screen='bossrushresult';
    render();
    return;
  }
  G.player.hp = G.player.maxHp;
  const bossId = G.bossRushQueue[G.bossRushIdx];
  const idx = ACT_CONFIG.length;
  ACT_CONFIG.push({tower:3, name:`ボスラッシュ ${G.bossRushIdx+1}/${G.bossRushQueue.length}`, normals:ALL_NORMALS, elites:ALL_ELITES, boss:bossId});
  ACT_MODIFIERS.push(null);
  G.act = idx;
  startCombatAt('boss');
}
function renderBossRushResult(){
  app.innerHTML = `<div class="screen end-screen">
    <div style="font-size:54px;">🔥👑</div>
    <h2 style="color:var(--gold); font-size:28px;">ボスラッシュ制覇！</h2>
    <div class="modal-sub">${G.bossRushQueue.length}体のボスを全て打ち破った。まさに伝説の挑戦者だ。</div>
    <div class="stat-grid">
      <div class="stat-box"><b>${G.player.hp}/${G.player.maxHp}</b><span>残りHP</span></div>
      <div class="stat-box"><b>${G.player.deck.length}</b><span>最終デッキ</span></div>
    </div>
    <button class="btn btn-main" onclick="startBossRush()">もう一度挑戦</button>
    <button class="btn btn-ghost" onclick="backToTitleFromPvp()">タイトルへ戻る</button>
  </div>`;
}

/* ------------------------------- Boot ---------------------------------- */
newGame();
render();
</script>
