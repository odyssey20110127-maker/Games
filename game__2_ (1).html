<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>灰塔クライム ASHFALL SPIRE</title>
<style>
:root{
  --bg:#0f0c16;
  --bg2:#171325;
  --panel:#211b30;
  --panel-light:#2c2440;
  --panel-border:#443a5e;
  --parchment:#e8ddc0;
  --parchment-dark:#d3c194;
  --ink:#26201a;
  --ember:#b4472b;
  --ember-bright:#e2703a;
  --gold:#d4af5a;
  --teal:#4fb6a8;
  --text:#ece3d2;
  --text-dim:#9c93a3;
  --hp:#c0392b;
  --hpdark:#7a2015;
  --block:#5b8fc7;
  --poison:#6ab04c;
  --weak:#8e6bbf;
  --vulnerable:#e2703a;
  --strength:#c1502e;
  --common:#b7aa8c;
  --uncommon:#5b8fc7;
  --rare:#d4af5a;
  --boss-relic:#e05a9a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%; margin:0; overscroll-behavior:none; touch-action:manipulation;}
body{
  background:
    radial-gradient(ellipse at 50% -10%, #2a2038 0%, transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, #0a0810 100%);
  color:var(--text);
  font-family:-apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  overflow:hidden;
  position:fixed; inset:0;
}
#app{position:absolute; inset:0; overflow:hidden;}
.screen{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.serif{font-family:Georgia,"Iowan Old Style","Hiragino Mincho ProN","Yu Mincho",serif;}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Hiragino Mincho ProN","Yu Mincho",serif; letter-spacing:.04em; margin:0;}
::-webkit-scrollbar{display:none;}

/* ---------- TITLE ---------- */
.title-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; gap:22px;
  background:
   radial-gradient(circle at 50% 30%, rgba(226,112,58,.15), transparent 55%),
   linear-gradient(180deg,#100c1a,#0a0810);
}
.title-embers{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.ember-particle{position:absolute; bottom:-10px; width:4px; height:4px; border-radius:50%; background:var(--ember-bright); box-shadow:0 0 8px 2px var(--ember-bright); animation:rise linear infinite;}
@keyframes rise{ to{ transform:translateY(-110vh) translateX(var(--dx,0px)); opacity:0; } }
.game-title{font-size:min(13vw,64px); color:var(--parchment); text-shadow:0 0 24px rgba(226,112,58,.55), 0 2px 0 #000; letter-spacing:.12em;}
.game-subtitle{font-size:14px; color:var(--ember-bright); letter-spacing:.5em; text-transform:uppercase; margin-top:-8px;}
.title-tagline{color:var(--text-dim); font-size:14px; max-width:420px; line-height:1.8; padding:0 20px;}
.btn{
  border:1px solid var(--panel-border); background:linear-gradient(180deg,var(--panel-light),var(--panel));
  color:var(--text); padding:14px 28px; border-radius:6px; font-size:16px; letter-spacing:.05em; cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
}
.btn:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
.btn-main{background:linear-gradient(180deg,var(--ember-bright),var(--ember)); border-color:#7a3018; color:#fff8ec; font-weight:600; font-size:18px; padding:16px 44px;}
.btn-ghost{background:transparent; border:1px solid var(--panel-border); color:var(--text-dim);}
.btn:disabled{opacity:.35; pointer-events:none;}
.btn-small{padding:8px 14px; font-size:13px; border-radius:5px;}

/* ---------- MAP ---------- */
.map-screen{display:flex; flex-direction:column; height:100%;}
.map-header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--panel-border); flex-shrink:0; z-index:5;}
.map-act-title{font-size:13px; color:var(--ember-bright); letter-spacing:.15em;}
.hud-stats{display:flex; gap:14px; align-items:center; font-size:14px;}
.hud-stat{display:flex; align-items:center; gap:5px; background:var(--panel-light); padding:5px 10px; border-radius:20px; border:1px solid var(--panel-border);}
.map-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative;}
.map-svg-wrap{position:relative; width:100%; min-height:100%;}
.node-btn{
  position:absolute; width:56px; height:56px; border-radius:50%; transform:translate(-50%,-50%);
  display:flex; align-items:center; justify-content:center; font-size:24px;
  border:2px solid var(--panel-border); background:radial-gradient(circle at 35% 30%, var(--panel-light), var(--panel));
  cursor:pointer; transition:box-shadow .2s;
}
.node-btn.available{border-color:var(--ember-bright); box-shadow:0 0 0 4px rgba(226,112,58,.18), 0 0 16px rgba(226,112,58,.5); animation:pulse 1.6s ease-in-out infinite;}
.node-btn.done{opacity:.4; filter:grayscale(.6);}
.node-btn.current{border-color:var(--gold); box-shadow:0 0 0 5px rgba(212,175,90,.3);}
.node-btn.locked{opacity:.55;}
@keyframes pulse{ 0%,100%{box-shadow:0 0 0 4px rgba(226,112,58,.18),0 0 16px rgba(226,112,58,.5);} 50%{box-shadow:0 0 0 8px rgba(226,112,58,.05),0 0 26px rgba(226,112,58,.8);} }
.node-label{position:absolute; top:100%; left:50%; transform:translateX(-50%); font-size:10px; color:var(--text-dim); white-space:nowrap; margin-top:2px;}

/* ---------- COMBAT ---------- */
.combat-screen{display:flex; flex-direction:column; height:100%; background:
  radial-gradient(ellipse at 50% 0%, #241c34 0%, transparent 60%), var(--bg);}
.stage-label{position:absolute; top:6px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--text-dim); letter-spacing:.2em; z-index:3;}
.enemy-row{display:flex; justify-content:center; align-items:flex-end; gap:26px; padding:34px 10px 10px; flex-wrap:wrap; min-height:210px;}
.enemy{display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; position:relative; padding:4px; border-radius:10px;}
.enemy.targetable{animation:targetGlow 1s ease-in-out infinite;}
@keyframes targetGlow{0%,100%{filter:drop-shadow(0 0 4px var(--ember-bright));} 50%{filter:drop-shadow(0 0 14px var(--ember-bright));}}
.enemy-sprite{width:74px; height:74px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:38px; position:relative; border:2px solid rgba(255,255,255,.08);}
.enemy-sprite.rarity-uncommon{border:2px solid var(--uncommon); box-shadow:0 0 8px rgba(91,143,199,.5);}
.enemy-sprite.rarity-rare{border:2px solid var(--rare); box-shadow:0 0 10px rgba(212,175,90,.6);}
.enemy-sprite.rarity-boss{border:2px solid var(--boss-relic); box-shadow:0 0 14px rgba(224,90,154,.7);}
.enemy-dead{opacity:.15; filter:grayscale(1);}
.enemy-name{font-size:11px; color:var(--text-dim); max-width:96px; text-align:center; line-height:1.2;}
.intent{display:flex; align-items:center; gap:3px; background:rgba(0,0,0,.4); padding:3px 8px; border-radius:10px; font-size:12px; border:1px solid rgba(255,255,255,.08);}
.hpbar-wrap{width:96px;}
.bar-track{height:8px; border-radius:5px; background:#000; overflow:hidden; border:1px solid rgba(255,255,255,.08); position:relative;}
.bar-fill{height:100%; transition:width .3s;}
.hp-fill{background:linear-gradient(180deg,#e0564a,var(--hp));}
.hp-text{font-size:10px; text-align:center; color:var(--text-dim); margin-top:2px;}
.poison-preview{position:absolute; top:0; height:100%; background:repeating-linear-gradient(45deg, rgba(106,176,76,.95), rgba(106,176,76,.95) 3px, rgba(30,60,15,.95) 3px, rgba(30,60,15,.95) 6px); animation:poisonPulse 1.2s ease-in-out infinite;}
@keyframes poisonPulse{ 0%,100%{opacity:.65;} 50%{opacity:1;} }
.poison-warn{color:#8fd67a; font-weight:700;}
.block-chip{position:absolute; top:-6px; right:-6px; background:var(--block); color:#fff; font-size:10px; padding:2px 5px; border-radius:8px; display:flex; align-items:center; gap:2px; box-shadow:0 1px 4px rgba(0,0,0,.5);}
.status-row{display:flex; gap:3px; flex-wrap:wrap; justify-content:center; max-width:100px;}
.status-chip{font-size:10px; background:var(--panel-light); border:1px solid var(--panel-border); border-radius:6px; padding:1px 5px; display:flex; gap:2px; align-items:center;}

.mid-area{flex:1; display:flex; align-items:center; justify-content:center; position:relative;}
.turn-banner{position:absolute; top:8px; font-size:11px; color:var(--text-dim); letter-spacing:.2em;}
.piles-row{display:flex; gap:10px; padding:0 12px;}
.pile-chip{background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; width:46px; height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:var(--text-dim); cursor:pointer;}
.pile-chip b{font-size:16px; color:var(--text);}

.bottom-bar{flex-shrink:0; padding:6px 8px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(180deg, transparent, rgba(10,8,16,.9) 30%); position:relative;}
.player-info-row{display:flex; align-items:center; gap:10px; padding:0 8px 6px;}
.player-portrait{width:52px; height:52px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#4a3d5c,#241d30); border:2px solid var(--panel-border); display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}
.player-vitals{flex:1;}
.energy-orb{width:52px; height:52px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #7fe0d0, var(--teal)); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#0a2f2a; box-shadow:0 0 14px rgba(79,182,168,.6); flex-shrink:0;}
.end-turn-btn{background:linear-gradient(180deg,var(--ember-bright),var(--ember)); border:1px solid #7a3018; color:#fff8ec; border-radius:10px; padding:12px 18px; font-size:14px; font-weight:600; flex-shrink:0;}

.hand-row{display:flex; justify-content:center; align-items:flex-end; padding:4px 0; min-height:150px; gap:0;}
.card{
  width:104px; height:145px; border-radius:10px; background:linear-gradient(160deg,var(--parchment),var(--parchment-dark));
  border:2px solid #7a6a45; color:var(--ink); position:relative; margin:0 -14px; flex-shrink:0;
  box-shadow:0 4px 10px rgba(0,0,0,.5); transition:transform .15s; padding:6px; display:flex; flex-direction:column; cursor:pointer;
}
.card.attack{border-color:#8a3a2a;}
.card.skill{border-color:#3a5f8a;}
.card.power{border-color:#8a7a2a;}
.card.status,.card.curse{background:linear-gradient(160deg,#5b5560,#3a3540); border-color:#222; color:#ccc;}
.card.selected{transform:translateY(-30px) scale(1.08); z-index:20;}
.card.unplayable{filter:grayscale(.5) brightness(.8);}
.card-cost{position:absolute; top:-8px; left:-8px; width:26px; height:26px; border-radius:50%; background:var(--teal); color:#0a2f2a; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; border:2px solid #0a2f2a44; box-shadow:0 2px 4px rgba(0,0,0,.4);}
.card-name{font-size:11px; font-weight:700; text-align:center; margin-top:10px; line-height:1.2; padding:0 2px;}
.card-art{flex:1; display:flex; align-items:center; justify-content:center; font-size:26px; opacity:.8;}
.card-type{font-size:8px; text-align:center; color:#6b5b3a; letter-spacing:.1em; text-transform:uppercase;}
.card-desc{font-size:9px; text-align:center; line-height:1.25; padding:2px 4px 4px; color:#3a3126;}
.card-rarity-dot{position:absolute; bottom:3px; right:5px; width:6px; height:6px; border-radius:50%;}
.card.future{
  background:linear-gradient(160deg,#0c1622,#060a12); border-color:#1fb8e0; color:#cdeeff;
  box-shadow:0 4px 14px rgba(31,184,224,.35), inset 0 0 12px rgba(31,184,224,.08);
  font-family:'Courier New',monospace;
}
.card.future.attack{border-color:#ff3a6a; box-shadow:0 4px 14px rgba(255,58,106,.3), inset 0 0 12px rgba(255,58,106,.08);}
.card.future.skill{border-color:#1fb8e0; box-shadow:0 4px 14px rgba(31,184,224,.35), inset 0 0 12px rgba(31,184,224,.08);}
.card.future.power{border-color:#c583ff; box-shadow:0 4px 14px rgba(197,131,255,.35), inset 0 0 12px rgba(197,131,255,.08);}
.card.future .card-name{color:#9ff0ff; text-shadow:0 0 6px rgba(60,220,255,.6); letter-spacing:.02em;}
.card.future .card-desc{color:#a8d8e8;}
.card.future .card-type{color:#4fd8f0;}
.card.future .card-cost{background:linear-gradient(180deg,#3ad0ff,#1a7ab0); color:#04222e; border-color:#0a4a6a;}
.card.future .card-art{filter:drop-shadow(0 0 6px rgba(60,220,255,.7));}
.future-badge{position:absolute; top:-6px; right:-6px; font-size:10px; background:linear-gradient(180deg,#3ad0ff,#1a7ab0); color:#04222e; border-radius:6px; padding:1px 4px; font-weight:800; box-shadow:0 2px 4px rgba(0,0,0,.5); z-index:2;}
.card.space{
  background:
    radial-gradient(1.5px 1.5px at 20% 25%, rgba(255,255,255,.9) 50%, transparent 51%),
    radial-gradient(1px 1px at 65% 15%, rgba(255,255,255,.7) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 80% 60%, rgba(255,255,255,.8) 50%, transparent 51%),
    radial-gradient(1px 1px at 35% 70%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 50% 45%, rgba(255,255,255,.5) 50%, transparent 51%),
    linear-gradient(165deg,#1a1030,#0a0618);
  border-color:#8a5cf0; color:#dcd0ff;
  box-shadow:0 4px 14px rgba(138,92,240,.4), inset 0 0 14px rgba(138,92,240,.1);
}
.card.space.attack{border-color:#ff5aa8; box-shadow:0 4px 14px rgba(255,90,168,.35), inset 0 0 12px rgba(255,90,168,.1);}
.card.space.skill{border-color:#5ad0ff; box-shadow:0 4px 14px rgba(90,208,255,.35), inset 0 0 12px rgba(90,208,255,.1);}
.card.space.power{border-color:#b083ff; box-shadow:0 4px 14px rgba(176,131,255,.4), inset 0 0 12px rgba(176,131,255,.1);}
.card.space .card-name{color:#e8d8ff; text-shadow:0 0 8px rgba(180,130,255,.7); letter-spacing:.02em;}
.card.space .card-desc{color:#c8b8e8;}
.card.space .card-type{color:#c090ff;}
.card.space .card-cost{background:linear-gradient(180deg,#b083ff,#5a2ea8); color:#f8f0ff; border-color:#3a1a70;}
.card.space .card-art{filter:drop-shadow(0 0 8px rgba(180,130,255,.8));}
.space-badge{position:absolute; top:-6px; right:-6px; font-size:10px; background:linear-gradient(180deg,#b083ff,#5a2ea8); color:#f8f0ff; border-radius:6px; padding:1px 4px; font-weight:800; box-shadow:0 2px 4px rgba(0,0,0,.5); z-index:2;}

.floating-text{position:absolute; font-weight:800; font-size:20px; pointer-events:none; animation:floatUp 0.9s ease-out forwards; text-shadow:0 2px 3px rgba(0,0,0,.7); z-index:50;}
@keyframes floatUp{ 0%{transform:translateY(0); opacity:1;} 100%{transform:translateY(-46px); opacity:0;} }

/* ---------- MODAL / OVERLAYS ---------- */
.overlay{position:absolute; inset:0; background:rgba(6,4,10,.86); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;}
.modal-box{background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:22px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.modal-title{font-size:20px; color:var(--gold); margin-bottom:6px; text-align:center;}
.modal-sub{font-size:13px; color:var(--text-dim); text-align:center; margin-bottom:16px; line-height:1.6;}
.reward-row{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin:14px 0;}
.pile-list{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
.relic-icon{width:44px; height:44px; border-radius:8px; background:var(--panel-light); border:1px solid var(--panel-border); display:flex; align-items:center; justify-content:center; font-size:22px; position:relative; cursor:pointer;}
.relic-icon.common{border:2px solid var(--common);}
.relic-icon.uncommon{border:2px solid var(--uncommon); box-shadow:0 0 6px rgba(91,143,199,.5);}
.relic-icon.rare{border:2px solid var(--rare); box-shadow:0 0 8px rgba(212,175,90,.6);}
.relic-icon.boss{border:2px solid var(--boss-relic); box-shadow:0 0 10px rgba(224,90,154,.7);}
.relic-row{display:flex; gap:8px; flex-wrap:wrap; padding:6px 12px;}
.potion-slot{width:40px; height:40px; border-radius:8px; background:var(--panel-light); border:1px dashed var(--panel-border); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;}

.shop-list{display:flex; flex-direction:column; gap:10px; padding:10px;}
.shop-item{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:10px;}
.shop-item-info{flex:1;}
.shop-item-name{font-size:14px; font-weight:600;}
.shop-item-desc{font-size:11px; color:var(--text-dim); margin-top:2px;}
.price-tag{background:var(--gold); color:#3a2a10; font-weight:700; padding:6px 12px; border-radius:6px; font-size:13px; white-space:nowrap;}
.price-tag.disabled{background:#555; color:#999;}

.event-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:24px; text-align:center; gap:16px;}
.event-icon{font-size:56px;}
.event-title{font-size:22px; color:var(--gold);}
.event-text{max-width:480px; line-height:1.9; color:var(--text-dim); font-size:14px;}
.event-choices{display:flex; flex-direction:column; gap:10px; width:100%; max-width:420px;}
.event-choice-btn{text-align:left; padding:14px 16px;}
.event-choice-title{font-weight:700; font-size:14px;}
.event-choice-sub{font-size:11px; color:var(--text-dim); margin-top:3px;}

.end-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:16px; text-align:center; padding:24px;}
.stat-grid{display:flex; gap:22px; margin:8px 0;}
.stat-box{text-align:center;}
.stat-box b{font-size:24px; display:block; color:var(--gold);}
.stat-box span{font-size:11px; color:var(--text-dim);}

.section-label{font-size:11px; letter-spacing:.15em; color:var(--text-dim); text-align:center; margin:12px 0 4px;}
.rest-options{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding:20px;}
.rest-card-btn{width:170px; padding:20px 12px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center;}
.rest-card-btn .icon{font-size:34px;}

.upgrade-flag{position:absolute; top:-6px; right:-6px; background:var(--gold); color:#3a2a10; font-size:10px; font-weight:800; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.retain-flag{position:absolute; bottom:-6px; left:-6px; background:var(--teal); color:#0a2f2a; font-size:9px; font-weight:800; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;}

/* ---------- ANIMATION LAYERS ---------- */
#fx-layer{position:absolute; inset:0; pointer-events:none; z-index:150; overflow:hidden;}
#turn-banner-layer{position:absolute; inset:0; pointer-events:none; z-index:160; display:flex; align-items:center; justify-content:center;}
.floating-text{position:absolute; font-weight:800; font-size:22px; pointer-events:none; text-shadow:0 2px 4px rgba(0,0,0,.8); z-index:150; transform:translate(-50%,-50%); animation:floatUp 1s ease-out forwards;}
.floating-text.fx-dmg{color:#ff6b5a;}
.floating-text.fx-block{color:#8fc8ff;}
.floating-text.fx-heal{color:#7be08a;}
.floating-text.fx-status{color:#c9a6ff; font-size:15px;}
@keyframes floatUp{ 0%{transform:translate(-50%,-50%) scale(1); opacity:1;} 70%{opacity:1;} 100%{transform:translate(-50%,-130%) scale(1.1); opacity:0;} }

.turn-banner{background:linear-gradient(90deg,transparent,rgba(20,15,30,.92),transparent); color:var(--gold); font-size:18px; letter-spacing:.5em; padding:14px 40px; text-transform:uppercase; animation:bannerFlash 1.1s ease-in-out forwards;}
@keyframes bannerFlash{ 0%{opacity:0; transform:scale(.85);} 15%{opacity:1; transform:scale(1);} 78%{opacity:1;} 100%{opacity:0; transform:scale(1.05);} }

/* card draw-in */
.card.card-deal{ animation:dealIn .38s cubic-bezier(.2,.9,.3,1.2); }
@keyframes dealIn{ 0%{ transform:translate(140px,60px) rotate(24deg) scale(.6); opacity:0;} 100%{ transform:translate(0,0) rotate(0) scale(1); opacity:1;} }

/* card flying out when played (clone in fx-layer) */
.card-flying{position:absolute; pointer-events:none; z-index:300; margin:0 !important; animation:cardFly .38s ease-in forwards;}
@keyframes cardFly{ 0%{ transform:translate(0,0) scale(1) rotate(0deg); opacity:1;} 100%{ transform:translate(var(--tx,0px),var(--ty,-60px)) scale(.5) rotate(14deg); opacity:0;} }

/* hit reactions */
.shake-hit{ animation:shakeHit .32s ease-in-out; }
@keyframes shakeHit{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px) rotate(-3deg);} 40%{transform:translateX(6px) rotate(2deg);} 60%{transform:translateX(-5px);} 80%{transform:translateX(3px);} }
.flash-hit{ animation:flashHit .32s ease-out; }
@keyframes flashHit{ 0%{filter:brightness(2.4) saturate(0.4);} 100%{filter:brightness(1);} }
.pop-block{ animation:popBlock .34s ease-out; }
@keyframes popBlock{ 0%{transform:scale(.4); opacity:0;} 60%{transform:scale(1.25);} 100%{transform:scale(1); opacity:1;} }
.pop-status{ animation:popStatus .4s ease-out; }
@keyframes popStatus{ 0%{transform:scale(0) translateY(6px); opacity:0;} 70%{transform:scale(1.2);} 100%{transform:scale(1); opacity:1;} }
.attack-lunge{ animation:attackLunge .42s ease-in-out; }
@keyframes attackLunge{ 0%{transform:translateY(0);} 35%{transform:translateY(-16px) scale(1.08);} 55%{transform:translateY(10px) scale(.96);} 100%{transform:translateY(0);} }
.energy-spend{ animation:energyPulse .3s ease-out; }
@keyframes energyPulse{ 0%{transform:scale(1);} 40%{transform:scale(1.25); filter:brightness(1.5);} 100%{transform:scale(1);} }
.die-out{ animation:dieOut .5s ease-in forwards; }
@keyframes dieOut{ 0%{transform:scale(1) rotate(0); opacity:1;} 100%{transform:scale(.3) rotate(35deg); opacity:0;} }
.reward-pop{ animation:rewardPop .3s ease-out backwards; }
@keyframes rewardPop{ 0%{transform:translateY(18px) scale(.8); opacity:0;} 100%{transform:translateY(0) scale(1); opacity:1;} }
.node-pulse-enter{ animation:nodeEnter .3s ease-out; }
@keyframes nodeEnter{ 0%{transform:translate(-50%,-50%) scale(1.6); box-shadow:0 0 0 12px rgba(212,175,90,.5);} 100%{transform:translate(-50%,-50%) scale(1);} }

/* centered relic pickup popup */
#relic-popup-layer{position:absolute; inset:0; pointer-events:none; z-index:400; display:flex; align-items:center; justify-content:center;}
.relic-popup{background:linear-gradient(160deg,var(--panel-light),var(--panel)); border:2px solid var(--gold); border-radius:16px; padding:22px 30px; text-align:center; box-shadow:0 0 0 6px rgba(212,175,90,.12), 0 12px 40px rgba(0,0,0,.6); max-width:280px; animation:relicPopIn .45s cubic-bezier(.2,.9,.25,1.3), relicPopOut .5s ease-in forwards 2.4s;}
.relic-popup-icon{font-size:46px; filter:drop-shadow(0 0 10px rgba(212,175,90,.6));}
.relic-popup-label{font-size:11px; color:var(--ember-bright); letter-spacing:.25em; margin-top:6px;}
.relic-popup-name{font-size:17px; color:var(--gold); font-weight:700; margin-top:4px;}
.relic-popup-desc{font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.6;}
@keyframes relicPopIn{ 0%{transform:scale(.5) translateY(20px); opacity:0;} 70%{transform:scale(1.05);} 100%{transform:scale(1) translateY(0); opacity:1;} }
@keyframes relicPopOut{ 0%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(.9) translateY(-10px);} }

@media (min-width:700px){
  .card{width:118px; height:164px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx-layer"></div>
<div id="turn-banner-layer"></div>
<div id="relic-popup-layer"></div>
<div id="modal-root"></div>
<script>
'use strict';
/* =========================================================================
   ASHFALL SPIRE — a Slay-the-Spire-like deckbuilding roguelike
   Single-file build. Vanilla JS + DOM rendering. No external assets.
========================================================================= */

/* ------------------------------- Utils ---------------------------------- */
const rnd = (n) => Math.floor(Math.random()*n);
const rndf = (a,b) => a + Math.random()*(b-a);
const choice = (arr) => arr[rnd(arr.length)];
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=rnd(i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
let UID = 1;
const nextUid = ()=> UID++;

/* ------------------------------- Card DB --------------------------------- */
// helper effect builders operate on ctx = {self(player), target(enemy obj or null), all(alive enemies array), card}
function dealDamage(attacker, defender, base, hits){
  hits = hits||1;
  let total=0;
  for(let i=0;i<hits;i++){
    if(defender.hp<=0) break;
    let dmg = base;
    if(attacker.strength) dmg += attacker.strength;
    if(dmg<0) dmg=0;
    if(attacker.weak>0) dmg = Math.floor(dmg*0.75);
    if(defender.vulnerable>0) dmg = Math.floor(dmg*1.5);
    dmg = Math.max(0,Math.round(dmg));
    const absorbed = Math.min(defender.block, dmg);
    defender.block -= absorbed;
    let toHp = dmg-absorbed;
    if(defender===G.player && G.combat && G.combat.ghostCloakReady && toHp>0){
      toHp = Math.floor(toHp*0.5);
      G.combat.ghostCloakReady = false;
      toast('亡霊のマントが衝撃を和らげた');
    }
    if(defender===G.player && toHp>0 && (defender.hp-toHp)<=0 && G.player.relics.includes('emberguard') && G.combat && !G.combat.emberGuardUsed){
      toHp = Math.max(0, defender.hp-1);
      G.combat.emberGuardUsed = true;
      toast('護りの残り火で致命傷を耐えた！');
    }
    defender.hp = clamp(defender.hp-toHp,0,defender.maxHp);
    total += toHp;
    queueFx(defender, dmg>0? ('-'+dmg) : '0', absorbed>=dmg&&dmg>0?'block':'dmg');
    if(dmg>0) defender._justHit = true;
    if(defender===G.player) hookOnPlayerDamaged(toHp);
    if(attacker===G.player && dmg>0 && G.player.relics.includes('spiderring') && Math.random()<0.2){
      applyPoisonToEnemy(defender, 1);
    }
    if(attacker===G.player && dmg>0 && G.player.relics.includes('venomfang') && Math.random()<0.2){
      applyPoisonToEnemy(defender, 2);
    }
    if(attacker===G.player && dmg>0 && G.player.powers.viralUplink && Math.random()<0.2){
      applyPoisonToEnemy(defender, 3);
    }
    if(defender===G.player && toHp>0 && G.player.powers.ironWill && G.combat){
      G.combat.pendingDelayedBlock = (G.combat.pendingDelayedBlock||0) + Math.floor(toHp*0.3);
    }
    if(defender===G.player && toHp>0 && G.player.powers.thornsAmt && attacker!==G.player && attacker.hp>0){
      dealDamage(G.player, attacker, G.player.powers.thornsAmt);
    }
    if(defender===G.player && toHp>0 && G.player.powers.poisonThorns && attacker!==G.player && attacker.hp>0){
      applyPoisonToEnemy(attacker, G.player.powers.poisonThorns);
    }
    if(defender!==G.player && defender.hp<=0 && !defender._deathHookFired){
      defender._deathHookFired = true;
      G.player.relics.forEach(rk=>{ const r=RELIC_DB[rk]; if(r.onKill) r.onKill(); });
      if(attacker===G.player && G.player.powers.plaguePact && defender.poison>0){ drawCards(1); }
    }
  }
  return total;
}
function gainBlock(entity, amount){
  let amt = amount;
  if(entity.frail>0) amt = Math.floor(amt*0.75);
  if(entity.dexterity) amt += entity.dexterity;
  if(entity===G.player && G.player.powers.undyingWill && G.player.hp <= G.player.maxHp*0.25) amt = Math.floor(amt*1.5);
  if(amt<0) amt=0;
  entity.block += amt;
  queueFx(entity, '+'+amt, 'block');
  if(amt>0) entity._justBlocked = true;
  if(entity===G.player) hookOnPlayerGainBlock(amt);
}
const STATUS_ICONS = {strength:'💪', dexterity:'🤸', weak:'😩', vulnerable:'🎯', frail:'😓', poison:'☠️'};
function predictedSelfDamageNextTurn(entity){
  let dmg = entity.poison||0;
  if(entity===G.player){
    if(G.player.powers.combust) dmg += 1;
    if(G.player.powers.berserk) dmg += 2;
  }
  return dmg;
}
function hpBarHtml(entity, heightPx){
  const pct = Math.max(0, entity.hp/entity.maxHp*100);
  const predicted = Math.min(entity.hp, predictedSelfDamageNextTurn(entity));
  const futurePct = Math.max(0, (entity.hp-predicted)/entity.maxHp*100);
  const previewWidth = pct-futurePct;
  const preview = predicted>0 ? `<div class="poison-preview" style="left:${futurePct}%; width:${previewWidth}%;"></div>` : '';
  const warn = predicted>0 ? ` <span class="poison-warn">☠️次T-${predicted}</span>` : '';
  return {
    bar: `<div class="bar-track" style="height:${heightPx}px;"><div class="bar-fill hp-fill" style="width:${pct}%"></div>${preview}</div>`,
    warn,
  };
}
function applyPoisonToEnemy(target, amt){
  let bonus = 0;
  if(G.player.powers.plagueTouch) bonus += 1;
  if(G.player.relics.includes('miasmacharm')) bonus += 1;
  let total = amt+bonus;
  if(target.poisonRes) total = Math.max(0, total-target.poisonRes);
  if(total>0) addStatus(target, 'poison', total);
}
function addStatus(entity, key, amount){
  entity[key] = (entity[key]||0) + amount;
  if(entity[key]<0 && key!=='strength' && key!=='dexterity') entity[key]=0;
  if(amount!==0 && STATUS_ICONS[key]){ queueFx(entity, `${STATUS_ICONS[key]}${amount>0?'+':''}${amount}`, 'status'); }
  if(key==='strength' && amount>0 && entity.powers && entity.powers.dexSync){
    entity.dexterity = (entity.dexterity||0) + amount;
    queueFx(entity, `${STATUS_ICONS.dexterity}+${amount}`, 'status');
  }
  if(key==='strength' && amount>0 && entity===G.player && entity.powers && entity.powers.neuralOverride && G.combat){
    G.combat.battery = Math.min(6, (G.combat.battery||0)+amount);
  }
  if(key==='strength' && amount>0 && entity===G.player && entity.powers && entity.powers.cosmicSync && G.combat){
    G.combat.stardust = Math.min(6, (G.combat.stardust||0)+amount);
  }
}
function aliveEnemies(){ return G.combat.enemies.filter(e=>e.hp>0); }
function randomAliveEnemy(){ const a=aliveEnemies(); return a.length? choice(a):null; }

function drawCards(n){
  const c = G.combat;
  if(c.noMoreDrawThisTurn) return;
  for(let i=0;i<n;i++){
    if(c.hand.length>=10) break;
    if(c.drawPile.length===0){
      if(c.discardPile.length===0) break;
      c.drawPile = shuffle(c.discardPile);
      c.discardPile=[];
    }
    c.hand.push(c.drawPile.pop());
  }
}
function exhaustCardFromWherever(pile, idx){
  const card = pile.splice(idx,1)[0];
  G.combat.exhaustPile.push(card);
  hookOnExhaust(card);
  return card;
}
function discardFromHand(card){
  const h=G.combat.hand;
  const idx=h.indexOf(card);
  if(idx>=0) h.splice(idx,1);
  G.combat.discardPile.push(card);
  if(G.player.powers.swiftInstinct){ const e=randomAliveEnemy(); if(e) dealDamage(G.player,e,G.player.powers.swiftInstinct); }
}
function hookOnExhaust(card){
  if(G.player.powers.darkEmbrace) drawCards(1);
  if(G.player.powers.feelNoPain) gainBlock(G.player, 3);
  if(G.player.powers.soulHarvest){ const e=randomAliveEnemy(); if(e) dealDamage(G.player, e, G.player.powers.soulHarvest); }
}
function hookOnPlayerGainBlock(amt){
  if(G.player.powers.juggernaut && amt>0){
    const e = randomAliveEnemy();
    if(e) dealDamage(G.player, e, 5);
  }
}
function hookOnPlayerDamaged(amt){
  G.combat.damageTakenThisCombat = (G.combat.damageTakenThisCombat||0) + amt;
}

/* Card definitions. Numeric fields (dmg/block/hits/amt) are read by effect fns so upgrades can alter them generically. */
const CARD_DB = {
  strike:{name:'ストライク', type:'attack', cost:1, rarity:'basic', target:'enemy', dmg:6,
    desc:c=>`敵に${c.dmg}ダメージ。`, upg:{dmg:9},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); }},
  defend:{name:'ディフェンド', type:'skill', cost:1, rarity:'basic', target:'self', block:5,
    desc:c=>`防御${c.block}を得る。`, upg:{block:8},
    effect:(ctx)=>{ gainBlock(G.player, ctx.card.block); }},
  bash:{name:'一刀両断', type:'attack', cost:2, rarity:'basic', target:'enemy', dmg:8, amt:2,
    desc:c=>`敵に${c.dmg}ダメージ。脆弱${c.amt}を付与。`, upg:{dmg:10,amt:3},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); addStatus(ctx.target,'vulnerable',ctx.card.amt); }},

  cleave:{name:'薙ぎ払い', type:'attack', cost:1, rarity:'common', target:'all', dmg:8,
    desc:c=>`敵全体に${c.dmg}ダメージ。`, upg:{dmg:11},
    effect:(ctx)=>{ aliveEnemies().forEach(e=>dealDamage(G.player,e,ctx.card.dmg)); }},
  twinstrike:{name:'双撃', type:'attack', cost:1, rarity:'common', target:'enemy', dmg:5, hits:2,
    desc:c=>`敵に${c.dmg}ダメージを${c.hits}回。`, upg:{dmg:7},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg, ctx.card.hits); }},
  ironwave:{name:'鉄波の一撃', type:'attack', cost:1, rarity:'common', target:'enemy', dmg:5, block:5,
    desc:c=>`防御${c.block}を得て、敵に${c.dmg}ダメージ。`, upg:{dmg:7,block:7},
    effect:(ctx)=>{ gainBlock(G.player, ctx.card.block); dealDamage(G.player, ctx.target, ctx.card.dmg); }},
  bodyslam:{name:'体当たり', type:'attack', cost:1, rarity:'common', target:'enemy', dmg:0,
    desc:()=>`自分の防御力と同じダメージを敵に与える。`, upg:{cost:0},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, G.player.block); }},
  clothesline:{name:'首狩り', type:'attack', cost:2, rarity:'common', target:'enemy', dmg:12, amt:2,
    desc:c=>`敵に${c.dmg}ダメージ。弱体${c.amt}を付与。`, upg:{dmg:14},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); addStatus(ctx.target,'weak',ctx.card.amt); }},
  pommelstrike:{name:'柄打ち', type:'attack', cost:1, rarity:'common', target:'enemy', dmg:9, amt:1,
    desc:c=>`敵に${c.dmg}ダメージ。カードを${c.amt}枚引く。`, upg:{amt:2},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); drawCards(ctx.card.amt); }},
  swordflurry:{name:'剣の乱舞', type:'attack', cost:1, rarity:'common', target:'random', dmg:3, hits:3,
    desc:c=>`ランダムな敵に${c.dmg}ダメージを${c.hits}回。`, upg:{hits:4},
    effect:(ctx)=>{ for(let i=0;i<ctx.card.hits;i++){ const e=randomAliveEnemy(); if(e) dealDamage(G.player,e,ctx.card.dmg);} }},
  recklessrush:{name:'猛進', type:'attack', cost:0, rarity:'common', target:'enemy', dmg:10, self:3,
    desc:c=>`敵に${c.dmg}ダメージ。自分に${c.self}ダメージ。`, upg:{dmg:14},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); G.player.hp = clamp(G.player.hp-ctx.card.self,0,G.player.maxHp); queueFx(G.player,'-'+ctx.card.self,'dmg'); }},

  heavyblade:{name:'重剣撃', type:'attack', cost:2, rarity:'uncommon', target:'enemy', dmg:10, mult:2,
    desc:c=>`敵に${c.dmg}+STR×${c.mult}ダメージ。`, upg:{dmg:14},
    effect:(ctx)=>{ const bonus=(G.player.strength||0)*ctx.card.mult; dealDamage(G.player, ctx.target, ctx.card.dmg+bonus - (G.player.strength||0)); }},
  whirlwind:{name:'旋風', type:'attack', cost:-1, rarity:'uncommon', target:'all', dmg:5,
    desc:c=>`残りエネルギー分、敵全体に${c.dmg}ダメージ。`, upg:{dmg:7},
    effect:(ctx)=>{ const times=ctx.energyUsed; for(let i=0;i<times;i++){ aliveEnemies().forEach(e=>dealDamage(G.player,e,ctx.card.dmg)); } }},
  uppercut:{name:'抉り上げ', type:'attack', cost:2, rarity:'uncommon', target:'enemy', dmg:13, amt:1,
    desc:c=>`敵に${c.dmg}ダメージ。弱体・脆弱を${c.amt}ずつ付与。`, upg:{amt:2},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); addStatus(ctx.target,'weak',ctx.card.amt); addStatus(ctx.target,'vulnerable',ctx.card.amt); }},
  rampage:{name:'連撃の型', type:'attack', cost:1, rarity:'uncommon', target:'enemy', dmg:8, inc:5,
    desc:c=>`敵に${c.dmg}ダメージ。使うたび+${c.inc}(このバトル中)。`, upg:{inc:8},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); ctx.card.dmg += ctx.card.inc; ctx.card.desc=CARD_DB.rampage.desc; }},
  bloodfeud:{name:'血讐', type:'attack', cost:2, rarity:'uncommon', target:'enemy', dmg:18,
    desc:c=>`敵に${c.dmg}ダメージ。`, upg:{dmg:22},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); }},
  reaper:{name:'刈り取り', type:'attack', cost:2, rarity:'rare', target:'all', dmg:7,
    desc:c=>`敵全体に${c.dmg}ダメージ。与えた分HP回復。`, upg:{dmg:9},
    effect:(ctx)=>{ let total=0; aliveEnemies().forEach(e=>{ total+=dealDamage(G.player,e,ctx.card.dmg); }); G.player.hp=clamp(G.player.hp+total,0,G.player.maxHp); }},
  feed:{name:'大喰らい', type:'attack', cost:2, rarity:'rare', target:'enemy', dmg:12, amt:4,
    desc:c=>`敵に${c.dmg}ダメージ。倒せば最大HP+${c.amt}(永続)。`, upg:{dmg:16,amt:5},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); if(ctx.target.hp<=0){ G.player.maxHp+=ctx.card.amt; G.player.hp+=ctx.card.amt; } }},
  searingblow:{name:'灼熱斬', type:'attack', cost:2, rarity:'rare', target:'enemy', dmg:16,
    desc:c=>`敵に${c.dmg}ダメージ。`, upg:{dmg:22},
    effect:(ctx)=>{ dealDamage(G.player, ctx.target, ctx.card.dmg); }},

  shrugitoff:{name:'肩透かし', type:'skill', cost:1, rarity:'common', target:'self', block:8, amt:1,
    desc:c=>`防御${c.block}を得る。カードを${c.amt}枚引く。`, upg:{block:11},
    effect:(ctx)=>{ gainBlock(G.player, ctx.card.block); drawCards(ctx.card.amt); }},
  truegrit:{name:'不屈', type:'skill', cost:1, rarity:'common', target:'self', block:7,
    desc:c=>`防御${c.block}を得る。`, upg:{block:9},
    effect:(ctx)=>{ gainBlock(G.player, ctx.card.block); }},
  trip:{name:'転び', type:'skill', cost:0, rarity:'common', target:'enemy', amt:1,
    desc:c=>`敵に脆弱${c.amt}を付与。`, upg:{amt:2},
    effect:(ctx)=>{ addStatus(ctx.target,'vulnerable',ctx.card.amt); }},
  warcry:{name:'威嚇', type:'skill', cost:0, rarity:'common', target:'self', amt:1, exhaust:true,
    desc:c=>`カードを${c.amt}枚引く。(使用後exhaust)`, upg:{amt:2},
    effect:(ctx)=>{ drawCards(ctx.card.amt); }},

  armaments:{name:'武装強化', type:'skill', cost:1, rarity:'uncommon', target:'self', block:5,
    desc:c=>`防御${c.block}を得る。手札1枚をこのバトル中アップグレード。`, upg:{block:8},
    effect:(ctx)=>{ gainBlock(G.player, ctx.card.block); const h=G.combat.hand.filter(c=>!c.upgraded && CARD_DB[c.id] && CARD_DB[c.id].upg); if(h.length){ const t=choice(h); applyTempUpgrade(t);} }},
  flamebarrier:{name:'火炎障壁', type:'skill', cost:2, rarity:'uncommon', target:'self', block:12, retal:4,
    desc:c=>`防御${c.block}を得る。このターン被弾時に${c.retal}反撃(重ねがけ可)。`, upg:{block:16},
    effect:(ctx)=>{ gainBlock(G.player, ctx.card.block); G.combat.flameBarrier=(G.combat.flameBarrier||0)+ctx.card.retal; }},
  battletrance:{name:'戦術思考', type:'skill', cost:0, rarity:'uncommon', target:'self', amt:3,
    desc:c=>`カードを${c.amt}枚引く。このターンはもう引けない。`, upg:{amt:4},
    effect:(ctx)=>{ drawCards(ctx.card.amt); G.combat.noMoreDrawThisTurn=true; }},
  entrench:{name:'塹壕', type:'skill', cost:2, rarity:'uncommon', target:'self',
    desc:()=>`現在の防御力を2倍にする。`, upg:{cost:1},
    effect:(ctx)=>{ G.player.block*=2; queueFx(G.player,'x2','block'); }},
  rage:{name:'怒り', type:'skill', cost:1, rarity:'uncommon', target:'self', amt:3,
    desc:c=>`このターン、攻撃カードを使うたび防御${c.amt}を得る(重ねがけ可)。`, upg:{amt:5},
    effect:(ctx)=>{ G.combat.rageAmt=(G.combat.rageAmt||0)+ctx.card.amt; }},
  disarm:{name:'武装解除', type:'skill', cost:1, rarity:'uncommon', target:'enemy', amt:-2, exhaust:true,
    desc:c=>`敵の力${c.amt}。(使用後exhaust)`, upg:{amt:-3},
    effect:(ctx)=>{ addStatus(ctx.target,'strength',ctx.card.amt); }},
  impervious:{name:'不動', type:'skill', cost:2, rarity:'rare', target:'self', block:30, exhaust:true,
    desc:c=>`防御${c.block}を得る。(使用後exhaust)`, upg:{block:40},
    effect:(ctx)=>{ gainBlock(G.player, ctx.card.block); }},

function applyTempUpgrade(card){
  if(card.upgraded) return;
  const def = CARD_DB[card.id];
  if(!def.upg) return;
  Object.assign(card, def.upg);
  card.upgraded=true;
  card.name = card.name+'+';
}
function createCard(id, upgraded){
  const def = CARD_DB[id];
  const card = Object.assign({}, def, {id, uid: nextUid(), upgraded:false});
  if(upgraded) applyTempUpgrade(card);
  return card;
}

function isFutureAct(actIdx){ const a=ACT_CONFIG[actIdx]; return !!(a && a.tower>=4 && a.tower<7); }
function isSpaceAct(actIdx){ const a=ACT_CONFIG[actIdx]; return !!(a && a.tower>=7); }
function currentPools(){
  if(G.endless || G.bossRush) return [ALL_COMMON_POOL, ALL_UNCOMMON_POOL, ALL_RARE_POOL];
  if(isSpaceAct(G.act)) return [SPACE_COMMON_POOL, SPACE_UNCOMMON_POOL, SPACE_RARE_POOL];
  if(isFutureAct(G.act)) return [FUTURE_COMMON_POOL, FUTURE_UNCOMMON_POOL, FUTURE_RARE_POOL];
  return [COMMON_POOL, UNCOMMON_POOL, RARE_POOL];
}

function rollCardRewards(n){
  const out=[];
  const [cp,up,rp] = currentPools();
  const pools=[[cp,.6],[up,.3],[rp,.1]];
  for(let i=0;i<n;i++){
    let r=Math.random(), acc=0, pool=cp;
    for(const [p,w] of pools){ acc+=w; if(r<=acc){ pool=p; break; } }
    let id = choice(pool);
    let tries=0; while(out.some(c=>c.id===id) && tries<10){ id=choice(pool); tries++; }
    const upgraded = Math.random()<0.10;
    out.push(createCard(id, upgraded));
  }
  return out;
}

const RELIC_POOL_KEYS = Object.keys(RELIC_DB).filter(k=>k!=='oldring'&&k!=='whetstone'); // most obtainable randomly; special ones can appear too
function grantRelic(key){
  if(G.player.relics.includes(key)) return grantGold(25);
  G.player.relics.push(key);
  const r = RELIC_DB[key];
  if(r.onPickup) r.onPickup();
  showRelicPopup(r);
}
function showRelicPopup(r){
  const layer = document.getElementById('relic-popup-layer');
  const tierLabel = ({common:'コモン',uncommon:'アンコモン',rare:'レア',boss:'ボス級'})[r.rarity]||'';
  const tierColor = ({common:'var(--common)',uncommon:'var(--uncommon)',rare:'var(--rare)',boss:'var(--boss-relic)'})[r.rarity]||'#888';
  if(!layer){ toast(`遺物入手: ${r.icon} ${r.name}`); return; }
  const div = document.createElement('div');
  div.className = 'relic-popup';
  div.innerHTML = `
    <div class="relic-popup-icon">${r.icon}</div>
    <div class="relic-popup-label">遺物を入手した ${tierLabel?`<span style="color:${tierColor};">[${tierLabel}]</span>`:''}</div>
    <div class="relic-popup-name">${r.name}</div>
    <div class="relic-popup-desc">${r.desc}</div>`;
  layer.appendChild(div);
  setTimeout(()=>div.remove(), 2950);
}
function randomRelic(excludeOwned, tierWeights){
  const pool = Object.keys(RELIC_DB).filter(k=> !excludeOwned || !G.player.relics.includes(k));
  if(!pool.length) return choice(Object.keys(RELIC_DB));
  const weights = tierWeights || {common:.5, uncommon:.33, rare:.14, boss:.03};
  const order = ['common','uncommon','rare','boss'];
  const r=Math.random(); let acc=0, tier='common';
  for(const t of order){ acc += weights[t]||0; if(r<=acc){ tier=t; break; } }
  let tierPool = pool.filter(k=>RELIC_DB[k].rarity===tier);
  if(!tierPool.length) tierPool = pool;
  return choice(tierPool);
}
function grantGold(n){ G.player.gold += n; toast(`ゴールド +${n}`); }

const ACT_CONFIG_BASE_LEN = ACT_CONFIG.length;
const ALL_NORMALS = [...new Set(ACT_CONFIG.flatMap(a=>a.normals))];
const ALL_ELITES = [...new Set(ACT_CONFIG.flatMap(a=>a.elites))];
const ALL_BOSSES = [...new Set(ACT_CONFIG.map(a=>a.boss))];
const UNCOMMON_MONSTER_BY_TOWER = {1:'mutantstraggler',2:'rogueautomaton',3:'abysswanderer',4:'mutantdrone',5:'driftpredator',6:'endwalker',7:'lunarhunter',8:'voidraider',9:'cosmicaberration'};
function spawnEnemyGroup(actIdx, kind){
  const cfg = ACT_CONFIG[actIdx];
  let ids;
  if(kind==='boss') ids=[cfg.boss];
  else if(kind==='elite') ids=[choice(cfg.elites)];
  else {
    const roll = Math.random();
    if(roll<0.35) ids=[choice(cfg.normals)];
    else if(roll<0.75) ids=[choice(cfg.normals),choice(cfg.normals)];
    else ids=[choice(cfg.normals),choice(cfg.normals),choice(cfg.normals)];
    const uncommonId = UNCOMMON_MONSTER_BY_TOWER[cfg.tower];
    if(uncommonId && Math.random()<0.22){ ids[rnd(ids.length)] = uncommonId; }
  }
  return ids.map(id=>{
    const def = ENEMY_DB[id];
    const hp = def.hp[0]+rnd(def.hp[1]-def.hp[0]+1);
    // scale multi-spawn hp down a touch for balance
    let scaledHp = ids.length>1 ? Math.round(hp*0.72) : hp;
    if(cfg.hpMult) scaledHp = Math.round(scaledHp*cfg.hpMult);
    const e = {
      uid: nextUid(), id, name:def.name, icon:def.icon, color:def.color,
      hp:scaledHp, maxHp:scaledHp, block:0, strength:0, dexterity:0, weak:0, vulnerable:0, frail:0, poison:0, poisonRes:0,
      moves:def.moves, pattern:def.pattern||null, moveCount:0, lastMoveIdx:-1, elite:!!def.elite, boss:!!def.boss,
      rarity: def.rarity || (def.boss?'boss':def.elite?'rare':'common'),
    };
    e.nextMove = pickNextMove(e);
    return e;
  });
}
function pickNextMove(e){
  let idx;
  if(e.pattern){ idx = e.pattern[e.moveCount % e.pattern.length]; }
  else{
    do{ idx = rnd(e.moves.length); } while(e.moves.length>1 && idx===e.lastMoveIdx);
  }
  e.moveCount++;
  e.lastMoveIdx = idx;
  return e.moves[idx];
}

/* ------------------------------- Map Generation ---------------------------------- */
function generateMap(actIdx){
  const ROWS = 8; // 0=start battles ... 5=misc ... 6=rest ... 7=boss
  const rows=[];
  for(let r=0;r<ROWS;r++){
    let count = 3;
    if(r===ROWS-1) count=1;
    const nodes=[];
    for(let i=0;i<count;i++){
      let type;
      if(r===0) type='monster';
      else if(r===ROWS-1) type='boss';
      else if(r===ROWS-2) type='rest';
      else if(r===2||r===5) type = Math.random()<0.45 ? 'elite' : (Math.random()<0.5?'event':'monster');
      else {
        const roll=Math.random();
        if(roll<0.38) type='monster';
        else if(roll<0.56) type='event';
        else if(roll<0.70) type='shop';
        else if(roll<0.84) type='treasure';
        else if(roll<0.94) type='forge';
        else type='rest';
      }
      nodes.push({id:`${actIdx}_${r}_${i}`, row:r, col:i, type, done:false});
    }
    rows.push(nodes);
  }
  // ensure at least one shop, one treasure, and one forge per act (excluding row0/last rows)
  const midNodes = rows.slice(1,ROWS-2).flat();
  if(!midNodes.some(n=>n.type==='shop')) choice(midNodes).type='shop';
  if(!midNodes.some(n=>n.type==='treasure')) choice(midNodes).type='treasure';
  if(!midNodes.some(n=>n.type==='forge')) choice(midNodes).type='forge';
  if(ACT_CONFIG[actIdx] && ACT_CONFIG[actIdx].tower>=4){
    const nonBoundary = midNodes.filter(n=>n.type!=='forge');
    (nonBoundary.length? choice(nonBoundary) : choice(midNodes)).type='cyberlab';
  }
  // edges — every node in rows[0..ROWS-2] is guaranteed at least one outgoing edge,
  // and every node in rows[1..ROWS-1] is guaranteed at least one incoming edge,
  // so every path from a row-0 node to the boss passes through exactly ROWS nodes.
  for(let r=0;r<ROWS-1;r++){
    const cur=rows[r], next=rows[r+1];
    cur.forEach(n=>n.next=[]);
    next.forEach(n=>n.incoming=0);
    cur.forEach((n)=>{
      let candidates = next.filter(m=>Math.abs(m.col-n.col)<=1);
      if(!candidates.length){
        let nearest=next[0];
        next.forEach(m=>{ if(Math.abs(m.col-n.col)<Math.abs(nearest.col-n.col)) nearest=m; });
        candidates=[nearest];
      }
      const pickCount = candidates.length>1 && Math.random()<0.4 ? 2 : 1;
      const pick = shuffle([...candidates]).slice(0, pickCount);
      pick.forEach(m=>{ n.next.push(m.id); m.incoming=(m.incoming||0)+1; });
    });
    next.forEach(m=>{
      if(!m.incoming){
        const near = cur.reduce((best,n)=> Math.abs(n.col-m.col) < Math.abs(best.col-m.col) ? n : best, cur[0]);
        near.next.push(m.id); m.incoming=1;
      }
    });
  }
  return rows;
}
function flattenMap(rows){ const m={}; rows.flat().forEach(n=>m[n.id]=n); return m; }
// A node is selectable only if it's directly reachable from the node the player is
// currently standing on (or, before any pick, one of the three row-0 starting nodes).
// Once a path is chosen, sibling branches not on that path lock out permanently.
function isNodeAvailable(n){
  if(n.done) return false;
  if(G.currentNodeId==null) return n.row===0;
  const cur = G.mapFlat[G.currentNodeId];
  return !!(cur && cur.next && cur.next.includes(n.id));
}

/* ------------------------------- Combat ---------------------------------- */
function maxEnergyOf(){ return 3 + (G.player.maxEnergyBonus||0); }
function startCombatAt(kind){
  const enemies = spawnEnemyGroup(G.act, kind);
  G.combat = {
    kind, enemies,
    drawPile: shuffle(G.player.deck.map(c=>({...c}))),
    hand:[], discardPile:[], exhaustPile:[],
    energy:maxEnergyOf(), maxEnergy:maxEnergyOf(),
    turn:1, noMoreDrawThisTurn:false, rageAmt:0, flameBarrier:0, ghostCloakReady:false, emberGuardUsed:false,
    damageTakenThisCombat:0, selectedIdx:null, cardsPlayedThisTurn:0, skillsPlayedThisTurn:0, attacksPlayedThisTurn:0,
    echoNext:false, nextAttackBonus:0, pendingDelayedBlock:0, prevHandUids:new Set(),
  };
  G.player.block=0; G.player.strength=0; G.player.dexterity=0; G.player.weak=0; G.player.vulnerable=0; G.player.frail=0; G.player.poison=G.player.poison||0; G.player.poisonRes=0;
  G.player.powers={};
  G.player.poison=0; G.player.flexAmt=0;
  G.screen='combat';
  G.player.relics.forEach(rk=>{ const r=RELIC_DB[rk]; if(r.onCombatStart) r.onCombatStart(); });
  const mod = ACT_MODIFIERS[G.act];
  if(mod && mod.onCombatStart) mod.onCombatStart();
  startPlayerTurn(true);
}
function startPlayerTurn(first){
  const c=G.combat;
  c.noMoreDrawThisTurn=false; c.rageAmt=0; c.flameBarrier=0; c.cardsPlayedThisTurn=0; c.skillsPlayedThisTurn=0; c.attacksPlayedThisTurn=0; c.echoNext=false; c.nextAttackBonus=0; c.momentumStacks=0;
  G.player.block=0;
  if(c.pendingDelayedBlock){ gainBlock(G.player, c.pendingDelayedBlock); c.pendingDelayedBlock=0; }
  let drawN = 5 + (G.player.powers.extraDraw||0);
  if(first && c.extraDrawFirstTurn) drawN += c.extraDrawFirstTurn;
  drawCards(drawN);
  c.energy=c.maxEnergy;
  if(isFutureAct(G.act)){ c.battery = Math.min(6,(c.battery||0)+1); }
  if(G.player.powers.batteryGen){ c.battery = Math.min(6,(c.battery||0)+G.player.powers.batteryGen); }
  if(isSpaceAct(G.act)){ c.stardust = Math.min(6,(c.stardust||0)+1); }
  if(G.player.powers.stardustGen){ c.stardust = Math.min(6,(c.stardust||0)+G.player.powers.stardustGen); }
  G.player.relics.forEach(rk=>{ const r=RELIC_DB[rk]; if(r.onTurnStart) r.onTurnStart(); });
  if(G.player.powers.regen){ const h=G.player.powers.regen; G.player.hp=clamp(G.player.hp+h,0,G.player.maxHp); queueFx(G.player,'+'+h,'heal'); }
  if(G.player.powers.droneHive){ const e=randomAliveEnemy(); if(e) dealDamage(G.player, e, G.player.powers.droneHive); }
  if(G.player.poison>0){ const p=G.player.poison; G.player.hp=clamp(G.player.hp-p,0,G.player.maxHp); addStatus(G.player,'poison',-1); queueFx(G.player,'-'+p,'dmg'); G.player._justHit=true; }
  if(G.player.powers.combust){ G.player.hp=clamp(G.player.hp-1,0,G.player.maxHp); G.player._justHit=true; aliveEnemies().forEach(e=>dealDamage(G.player,e,G.player.powers.combust)); }
  if(G.player.powers.demonForm){ addStatus(G.player,'strength',G.player.powers.demonForm); }
  if(G.player.powers.metallicize){ gainBlock(G.player,G.player.powers.metallicize); }
  if(G.player.powers.berserk){ G.player.hp=clamp(G.player.hp-2,0,G.player.maxHp); G.player._justHit=true; c.energy+=1; }
  if(!first) showTurnBanner('あなたのターン');
  if(G.player.relics.includes('chronofragment')){
    c.chronoSnapshot = {
      player: { hp:G.player.hp, block:G.player.block, strength:G.player.strength, dexterity:G.player.dexterity, weak:G.player.weak, vulnerable:G.player.vulnerable, frail:G.player.frail, poison:G.player.poison, poisonRes:G.player.poisonRes, flexAmt:G.player.flexAmt, powers:{...G.player.powers} },
      hand: c.hand.map(cd=>({...cd})),
      drawPile: c.drawPile.map(cd=>({...cd})),
      discardPile: c.discardPile.map(cd=>({...cd})),
      exhaustPile: c.exhaustPile.map(cd=>({...cd})),
      energy: c.energy,
      battery: c.battery,
      enemies: c.enemies.map(e=>({...e, powers:{...e.powers}})),
    };
  }
  checkCombatEnd();
  render();
}
window.useChronoFragment=function(){
  const c=G.combat;
  if(!c || !c.chronoSnapshot || c.chronoUsed) return;
  const snap=c.chronoSnapshot;
  Object.assign(G.player, snap.player);
  c.hand = snap.hand.map(cd=>({...cd}));
  c.drawPile = snap.drawPile.map(cd=>({...cd}));
  c.discardPile = snap.discardPile.map(cd=>({...cd}));
  c.exhaustPile = snap.exhaustPile.map(cd=>({...cd}));
  c.energy = snap.energy;
  c.battery = snap.battery;
  snap.enemies.forEach((es,i)=>{ if(c.enemies[i]){ Object.assign(c.enemies[i], es); c.enemies[i].powers={...es.powers}; } });
  c.chronoUsed = true;
  c.selectedIdx = null;
  toast('⏪ 時を巻き戻した！');

};
window.selectCard=function(idx){
  const c=G.combat;
  if(!c || c.over) return;
  const card = c.hand[idx];
  if(!card || card.unplayable) return;
  const cost = card.cost===-1 ? c.energy : card.cost;
  if(cost>c.energy) { toast('エネルギーが足りない'); return; }
  if(card.batteryCost && (c.battery||0)<card.batteryCost){ toast('バッテリーが足りない'); return; }
  if(card.stardustCost && (c.stardust||0)<card.stardustCost){ toast('星屑が足りない'); return; }
  if(card.target==='enemy'){
    const alive=aliveEnemies();
    if(!alive.length){ return; }
    if(alive.length>1){ c.selectedIdx = (c.selectedIdx===idx)?null:idx; render(); return; }
    resolveCardPlay(idx, alive[0]);
  } else {
    resolveCardPlay(idx, null);
  }
};
window.selectEnemyTarget=function(euid){
  const c=G.combat;
  if(c.selectedIdx==null) return;
  const target = c.enemies.find(e=>e.uid===euid);
  if(!target || target.hp<=0) return;
  resolveCardPlay(c.selectedIdx, target);
};
function resolveCardPlay(idx, target){
  const c=G.combat;
  const card = c.hand[idx];
  const originalCost = card.cost;
  const cost = card.cost===-1 ? c.energy : card.cost;
  animateCardPlay(card, target);
  c.energy -= cost;
  if(card.batteryCost) c.battery = Math.max(0, (c.battery||0)-card.batteryCost);
  if(card.stardustCost) c.stardust = Math.max(0, (c.stardust||0)-card.stardustCost);
  c.hand.splice(idx,1);
  c.selectedIdx=null;
  c.cardsPlayedThisTurn = (c.cardsPlayedThisTurn||0)+1;
  if(G.player.powers.momentum) c.momentumStacks = (c.momentumStacks||0)+1;
  if(card.type==='skill') c.skillsPlayedThisTurn = (c.skillsPlayedThisTurn||0)+1;
  if(card.type==='attack') c.attacksPlayedThisTurn = (c.attacksPlayedThisTurn||0)+1;
  const ctx={ self:G.player, target, card, energyUsed:cost, playNumber:c.cardsPlayedThisTurn };
  card.effect(ctx);
  if(card.cyberMod==='shield' && card.type==='attack') gainBlock(G.player, 3);
  if(card.type==='attack' && c.echoNext){ c.echoNext=false; card.effect(ctx); toast('残響: もう一度発動！'); }
  if(card.type==='attack' && c.nextAttackBonus){
    const bonusTarget = (target && target.hp>0) ? target : randomAliveEnemy();
    if(bonusTarget){ dealDamage(G.player, bonusTarget, c.nextAttackBonus); }
    c.nextAttackBonus=0;
  }
  if(card.type==='attack' && c.momentumStacks){
    const bonusTarget = (target && target.hp>0) ? target : randomAliveEnemy();
    if(bonusTarget){ dealDamage(G.player, bonusTarget, c.momentumStacks); }
  }
  if(card.type==='attack' && c.rageAmt) gainBlock(G.player, c.rageAmt);
  if(card.type==='attack' && G.player.powers.apprenticeGrowth && !card.upgraded && CARD_DB[card.id] && CARD_DB[card.id].upg && Math.random()*100<G.player.powers.apprenticeGrowth){
    applyTempUpgrade(card); toast(`見習いの成長: ${card.name}を強化した`);
  }
  if(card.type==='skill' && G.player.powers.battleTheory) addStatus(G.player,'strength',1);
  if(card.type==='power' && G.player.powers.rippleEffect && card.id!=='rippleeffect') gainBlock(G.player, G.player.powers.rippleEffect);
  if(card.retain && G.player.powers.patience) gainBlock(G.player, G.player.powers.patience);
  if(originalCost===0 && G.player.powers.fleetFoot) drawCards(1);
  if(card.exhaust){ c.exhaustPile.push(card); hookOnExhaust(card); }
  else { c.discardPile.push(card); }
  checkCombatEnd();
  render();
}
window.usePotionSlot=function(i){
  const key = G.player.potions[i];
  if(!key) return;
  const pot = POTION_DB[key];
  if(G.screen!=='combat'){ toast('戦闘中のみ使用できます'); return; }
  if(pot.target==='enemy'){
    const t = randomAliveEnemy();
    if(t) pot.use(t);
  } else pot.use();
  G.player.potions[i]=null;
  checkCombatEnd();
  render();
};
window.endTurn=function(){
  const c=G.combat;
  if(!c || c.over) return;
  if(G.player.flexAmt){ addStatus(G.player,'strength',-G.player.flexAmt); G.player.flexAmt=0; }
  if(G.player.relics.includes('ringofzeal') && c.cardsPlayedThisTurn>=4) gainBlock(G.player,5);
  // discard hand (unplayable+exhaust flagged go to exhaust; retain cards stay in hand)
  const toDiscard = c.hand.slice();
  c.hand = [];
  const kept=[];
  toDiscard.forEach(card=>{
    if(card.retain){ kept.push(card); return; }
    if(card.exhaust){ c.exhaustPile.push(card); }
    else { c.discardPile.push(card); if(card.cyberMod==='recycle') drawCards(1); }
  });
  c.hand.push(...kept);
  showTurnBanner('敵のターン');
  render();
  setTimeout(enemyPhase, 350);
};
async function enemyPhase(){
  const c=G.combat;
  if(!c || c.over) return;
  for(const e of aliveEnemies()){
    e.block=0;
    if(e.poison>0){ e.hp=clamp(e.hp-e.poison,0,e.maxHp); addStatus(e,'poison',-1); queueFx(e,'-'+e.poison,'dmg'); e._justHit=true; render(); await delay(260); }
    if(e.hp<=0) continue;
    const move = e.nextMove;
    const beforeHp = G.player.hp;
    e._justActed = true;
    render();
    await delay(260);
    move.effect(e);
    if(G.player.hp < beforeHp && c.flameBarrier){ dealDamage(G.player, e, c.flameBarrier); }
    if(e.weak>0) addStatus(e,'weak',-1);
    if(e.vulnerable>0) addStatus(e,'vulnerable',-1);
    if(e.frail>0) addStatus(e,'frail',-1);
    e.nextMove = pickNextMove(e);
    render();
    await delay(420);
    if(G.player.hp<=0) break;
  }
  if(G.player.weak>0) addStatus(G.player,'weak',-1);
  if(G.player.vulnerable>0) addStatus(G.player,'vulnerable',-1);
  if(G.player.frail>0) addStatus(G.player,'frail',-1);
  c.turn++;
  checkCombatEnd();
  if(!c.over) startPlayerTurn(false);
}
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }
function checkCombatEnd(){
  const c=G.combat;
  if(!c || c.over) return;
  if(G.mode==='pvp'){ pvpCheckCombatEnd(); return; }
  if(G.player.hp<=0){
    c.over=true; G.player.hp=0;
    setTimeout(()=>{ G.screen='gameover'; render(); }, 500);
    return;
  }
  if(aliveEnemies().length===0){
    c.over=true;
    G.runStats.enemiesDefeated += c.enemies.length;
    setTimeout(()=>onCombatVictory(), 500);
  }
}
function onCombatVictory(){
  const c=G.combat;
  let gold = c.kind==='boss'? (60+rnd(30)) : c.kind==='elite'? (30+rnd(20)) : (10+rnd(15));
  if(G.player.relics.includes('obsidianshard')) gold+=15;
  const uncommonKills = c.enemies.filter(e=>e.rarity==='uncommon').length;
  if(uncommonKills) gold += uncommonKills*12;
  grantGold(gold);
  const potionDrop = Math.random() < (c.kind==='boss'?1:(c.kind==='elite'?0.6:0.35));
  if(potionDrop) addPotion(choice(Object.keys(POTION_DB)));
  let relicDrop = c.kind==='elite' || c.kind==='boss';
  const wasBoss = c.kind==='boss';
  if(wasBoss) G.act++;
  const relicTierWeights = wasBoss
    ? {common:0, uncommon:.20, rare:.55, boss:.25}
    : (c.kind==='elite' ? {common:.30, uncommon:.45, rare:.23, boss:.02} : null);
  G.pendingReward = { gold, cards: rollCardRewards(3), relic: relicDrop? randomRelic(true, relicTierWeights) : null, potionDrop, wasBoss };
  G.screen='reward';
  render();
}
window.pickRewardCard=function(i){
  const card = G.pendingReward.cards[i];
  G.player.deck.push(card);
  G.runStats.cardsAdded++;
  G.pendingReward.cards=null;
  finishRewardIfDone();
};
window.skipRewardCards=function(){
  G.pendingReward.cards=null;
  finishRewardIfDone();
};
window.pickRewardRelic=function(){
  grantRelic(G.pendingReward.relic);
  G.pendingReward.relic=null;
  finishRewardIfDone();
};
function finishRewardIfDone(){
  if(G.pendingReward.cards || G.pendingReward.relic){ render(); return; }
  const wasBoss = G.pendingReward.wasBoss;
  G.pendingReward=null;
  if(G.bossRush){
    G.combat=null;
    advanceBossRush();
    return;
  }
  if(G.endless && wasBoss){
    G.combat=null;
    G.endlessFloor++;
    advanceEndlessFloor();
    return;
  }
  if(G.act>=ACT_CONFIG_BASE_LEN && !G.endless){ G.combat=null; G.screen='victory'; render(); return; }
  if(wasBoss){
    const crossingTower = ACT_CONFIG[G.act].tower !== ACT_CONFIG[G.act-1].tower;
    G.combat=null;
    if(crossingTower){ G.screen='towertransition'; render(); return; }
    G.map = generateMap(G.act);
    G.mapFlat = flattenMap(G.map);
    G.currentNodeId=null;
    G.screen='map';
    render();
    return;
  }
  G.combat=null;
  G.screen='map';
  render();
}
const BASIC_CARD_IDS = ['strike','defend','bash'];
window.beginDeckSelect=function(){
  const nonBasic = G.player.deck.filter(c=>!BASIC_CARD_IDS.includes(c.id));
  const maxKeep = 6 + (ACT_CONFIG[G.act].tower)*2; // tower2: keep 8, tower3: keep 10 — bounded so decks don't snowball forever
  const rarityRank={rare:3,uncommon:2,common:1,basic:0,status:-1,curse:-1};
  const sorted=[...nonBasic].sort((a,b)=> (rarityRank[b.rarity]-rarityRank[a.rarity]) || ((b.upgraded?1:0)-(a.upgraded?1:0)));
  const preselected = new Set(sorted.slice(0,maxKeep).map(c=>c.uid));
  G.deckSelectState = { maxKeep, selectedUids: preselected, pool: nonBasic };
  G.screen='deckselect';
  render();
};
window.toggleDeckSelectCard=function(uid){
  const s=G.deckSelectState;
  if(s.selectedUids.has(uid)) s.selectedUids.delete(uid);
  else if(s.selectedUids.size < s.maxKeep) s.selectedUids.add(uid);
  else toast(`最大${s.maxKeep}枚までです`);

};
window.confirmDeckSelect=function(){

/* ------------------------------- Shop ---------------------------------- */
function buildShopStock(){
  const disc = G.player.relics.includes('luckycoin')?0.8:1;
  const cardCount = 5 + (G.player.relics.includes('merchanttoken')?1:0);
  const cards=[];
  for(let i=0;i<cardCount;i++){
    const [cp,up,rp] = currentPools();
    const pools=[[cp,.55],[up,.35],[rp,.10]];
    let roll=Math.random(),acc=0,pool=cp;
    for(const [p,w] of pools){ acc+=w; if(roll<=acc){pool=p;break;} }
    const id=choice(pool);
    const price = Math.round((pool===rp?150:pool===up?85:50)*disc)+rnd(15);
    cards.push({card:createCard(id), price});
  }
  const relics=[];
  for(let i=0;i<2;i++){
    const key = randomRelic(true, {common:.55, uncommon:.35, rare:.10, boss:0});
    const tierPrice = ({common:90,uncommon:140,rare:210})[RELIC_DB[key].rarity]||130;
    relics.push({key, price: Math.round((tierPrice+rnd(40))*disc)});
  }
  const potions=[];
  for(let i=0;i<2;i++){ potions.push({key: choice(Object.keys(POTION_DB)), price: Math.round((45+rnd(20))*disc)}); }
  return {cards, relics, potions, removePrice: Math.round(75*disc), removed:false};
}

      <div class="shop-item-info"><div class="shop-item-name">${it.card.name}</div><div class="shop-item-desc">${it.card.desc(it.card)}</div></div>
      <div class="price-tag ${G.player.gold<it.price?'disabled':''}" onclick="buyShopCard(${i})">${it.price}G</div>
    </div>`).join('');
  const relicsHtml = s.relics.map((it,i)=> it.bought?'':`<div class="shop-item">
      <div class="relic-icon ${RELIC_DB[it.key].rarity||''}">${RELIC_DB[it.key].icon}</div>
      <div class="shop-item-info"><div class="shop-item-name">${RELIC_DB[it.key].name}</div><div class="shop-item-desc">${RELIC_DB[it.key].desc}</div></div>
      <div class="price-tag ${G.player.gold<it.price?'disabled':''}" onclick="buyShopRelic(${i})">${it.price}G</div>

  const potionsHtml = s.potions.map((it,i)=> it.bought?'':`<div class="shop-item">

    <div class="map-header"><div class="map-act-title">💰 商店</div><div class="hud-stats"><div class="hud-stat">💰 ${G.player.gold}</div></div></div>

window.buyShopRelic=function(i){ const it=G.shopStock.relics[i]; if(it.bought||G.player.gold<it.price) return; G.player.gold-=it.price; it.bought=true; grantRelic(it.key); renderShop(); };
window.buyShopPotion=function(i){ const it=G.shopStock.potions[i]; if(it.bought||G.player.gold<it.price) return; if(!G.player.potions.some(p=>!p)){ toast('秘薬の枠が満杯'); return; } G.player.gold-=it.price; it.bought=true; addPotion(it.key); renderShop(); };
window.useRemoveService=function(){
  const s=G.shopStock;

  openCardSelectModal(G.player.deck,'除去するカードを選択',(card)=>{
    const idx=G.player.deck.findIndex(c=>c.uid===card.uid);
    if(idx>=0){ G.player.deck.splice(idx,1); G.player.gold-=s.removePrice; s.removed=true; }
    closeModal(); renderShop();
  });
};

/* =========================================================================
   CREATIVE MODE — free deck-building from every card in the game
========================================================================= */
const ALL_DECKBUILD_IDS = Object.keys(CARD_DB).filter(id=>{
  const t = CARD_DB[id].type;
  return t!=='status' && t!=='curse';
});
let _deckBuilderCb = null;
window.openDeckBuilder = function(title, minCount, maxCount, onConfirm){
  _deckBuilderCb = onConfirm;
  G.deckBuilder = { title, minCount: minCount||1, maxCount: maxCount||null, counts:{} };
  G.screen='deckbuilder';
  render();
};
window.deckBuilderAdd=function(id){
  const db=G.deckBuilder; if(!db) return;
  const total = Object.values(db.counts).reduce((a,b)=>a+b,0);
  if(db.maxCount && total>=db.maxCount){ toast(`最大${db.maxCount}枚までです`); return; }
  db.counts[id]=(db.counts[id]||0)+1;
  render();
};
window.deckBuilderRemove=function(id){
  const db=G.deckBuilder; if(!db) return;
  if(db.counts[id]){ db.counts[id]--; if(!db.counts[id]) delete db.counts[id]; }
  render();
};
window.deckBuilderRandom=function(){
  const db=G.deckBuilder; if(!db) return;
  db.counts={};
  const atkIds = ALL_DECKBUILD_IDS.filter(id=>CARD_DB[id].type==='attack');
  const guaranteedAtk = 4+rnd(3);
  for(let i=0;i<guaranteedAtk;i++){
    const id=choice(atkIds);
    db.counts[id]=(db.counts[id]||0)+1;
  }
  const n = 10+rnd(6);
  for(let i=0;i<n;i++){
    const id=choice(ALL_DECKBUILD_IDS);
    db.counts[id]=(db.counts[id]||0)+1;
  }
  render();
};
window.deckBuilderClear=function(){ if(G.deckBuilder){ G.deckBuilder.counts={}; render(); } };
window.confirmDeckBuilder=function(){
  const db=G.deckBuilder; if(!db) return;
  const total = Object.values(db.counts).reduce((a,b)=>a+b,0);
  if(total<db.minCount){ toast(`最低${db.minCount}枚選んでください`); return; }
  const atkCount = Object.entries(db.counts).reduce((sum,[id,n])=> sum + (CARD_DB[id].type==='attack'? n:0), 0);
  if(atkCount<3){ toast('攻撃カードを3枚以上入れてください'); return; }
  const deckIds=[];
  Object.entries(db.counts).forEach(([id,n])=>{ for(let i=0;i<n;i++) deckIds.push(id); });
  const cb=_deckBuilderCb;
  _deckBuilderCb=null;
  G.deckBuilder=null;
  cb(deckIds);
};
window.cancelDeckBuilder=function(){
  _deckBuilderCb=null;
  G.deckBuilder=null;
  newGame();
  G.screen='title';
  render();
};
function renderDeckBuilder(){
  const db=G.deckBuilder;
  const total = Object.values(db.counts).reduce((a,b)=>a+b,0);
  const order=['basic','common','uncommon','rare'];
  const rarityLabel={basic:'ベーシック',common:'コモン',uncommon:'アンコモン',rare:'レア'};
  const groups={};
  ALL_DECKBUILD_IDS.forEach(id=>{
    const rk=CARD_DB[id].rarity;
    (groups[rk]=groups[rk]||[]).push(id);
  });
  let body='';
  order.forEach(rk=>{
    if(!groups[rk]) return;
    body+=`<div class="section-label">${rarityLabel[rk]} (${groups[rk].length})</div><div class="pile-list">`;
    groups[rk].forEach(id=>{
      const def=CARD_DB[id];
      const n=db.counts[id]||0;
      const fakeCard = Object.assign({}, def, {id});
      body+=`<div style="position:relative; ${n>0?'box-shadow:0 0 0 2px var(--gold); border-radius:12px;':''}">
        ${miniCardHtml(fakeCard)}
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:4px;">
          <button class="btn btn-small" style="padding:2px 10px;" onclick="deckBuilderRemove('${id}')">−</button>
          <b style="min-width:16px; text-align:center; font-size:13px;">${n}</b>
          <button class="btn btn-small" style="padding:2px 10px;" onclick="deckBuilderAdd('${id}')">＋</button>
        </div>
      </div>`;
    });
    body+='</div>';
  });
  app.innerHTML = `<div class="screen" style="padding-bottom:30px;">
    <div class="map-header">
      <div class="map-act-title">${db.title}</div>
      <div class="hud-stats"><div class="hud-stat">🂠 ${total}枚${db.minCount?` (最低${db.minCount})`:''}${db.maxCount?` / 最大${db.maxCount}`:''}</div></div>
    </div>
    <div class="modal-sub" style="padding:10px 16px 0;">全カードから自由に選んでデッキを組めます。＋/−タップで枚数を調整してください。</div>
    <div style="display:flex; gap:8px; justify-content:center; padding:8px;">
      <button class="btn btn-small" onclick="deckBuilderRandom()">🎲 ランダム編成</button>
      <button class="btn btn-small btn-ghost" onclick="deckBuilderClear()">クリア</button>
    </div>
    <div style="padding:8px 16px;">${body}</div>
    <div style="text-align:center; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center;">
      <button class="btn btn-main" onclick="confirmDeckBuilder()">この編成で決定 (${total}枚)</button>
      <button class="btn btn-ghost btn-small" onclick="cancelDeckBuilder()">キャンセルしてタイトルへ</button>
    </div>
  </div>`;
}
