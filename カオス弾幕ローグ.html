function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0}

function node(x,y){if(!x&&!y)return{r:0,n:'起点',k:'',v:0,c:0};const h=hash(x,y),r=Math.max(Math.abs(x),Math.abs(y));

function mkPlan(x0,y0,x1,y1){const sim=new Set(Object.keys(save.un)),list=[],seen=new Set(),fr=[],inR=(x,y)=>x>=x0&&x<=x1&&y>=y0&&y<=y1;let bud=save.souls,cost=0;
